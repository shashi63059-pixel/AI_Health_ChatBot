<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Health ChatBot</title>
  <style>
    :root {
      --bg-main: #0B1120;
      --bg-card: #1E293B;
      --bg-surface: #0F172A;
      --border: #334155;
      --border-light: #475569;
      --primary: #0EA5E9;
      --primary-hover: #0284C7;
      --teal: #14B8A6;
      --emerald: #10B981;
      --amber: #F59E0B;
      --rose: #EF4444;
      --text-main: #F8FAFC;
      --text-body: #E2E8F0;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: radial-gradient(1200px 600px at 20% -10%, #0e2a42 0%, var(--bg-main) 55%);
      color: var(--text-body);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 22px;
      background: rgba(17, 24, 39, 0.9);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px);
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--teal));
      display: grid;
      place-items: center;
      font-size: 20px;
      box-shadow: 0 0 22px rgba(14, 165, 233, 0.35);
    }

    .brand h1 {
      margin: 0;
      font-size: 17px;
      color: var(--text-main);
      letter-spacing: .2px;
    }

    .brand p {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--text-muted);
    }

    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--emerald);
      border: 1px solid rgba(16, 185, 129, 0.35);
      background: rgba(16, 185, 129, 0.08);
      padding: 6px 12px;
      border-radius: 999px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--emerald);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: .35;
      }
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      padding: 18px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .notice {
      font-size: 12px;
      color: var(--amber);
      background: rgba(245, 158, 11, 0.07);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 10px;
      padding: 10px 12px;
      line-height: 1.5;
    }

    .msg {
      display: flex;
      gap: 10px;
      max-width: 100%;
    }

    .msg.user {
      flex-direction: row-reverse;
    }

    .avatar {
      flex: 0 0 32px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
    }

    .msg.bot .avatar {
      border-color: rgba(45, 212, 191, 0.5);
      color: #2DD4BF;
    }

    .msg.user .avatar {
      border-color: rgba(56, 189, 248, 0.5);
      color: #38BDF8;
    }

    .bubble {
      padding: 11px 14px;
      border-radius: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      max-width: calc(100% - 52px);
    }

    .msg.user .bubble {
      background: rgba(14, 165, 233, 0.14);
      border-color: rgba(14, 165, 233, 0.4);
      color: var(--text-main);
    }

    .card {
      border: 1px solid rgba(14, 165, 233, 0.45);
      background: linear-gradient(180deg, rgba(14, 165, 233, .10), rgba(30, 41, 59, .65));
    }

    .card .disease {
      color: var(--text-main);
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .card .disease span {
      color: var(--teal);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .chip {
      border: 1px solid var(--border-light);
      background: var(--bg-surface);
      color: var(--text-body);
      border-radius: 999px;
      padding: 6px 13px;
      font-size: 12.5px;
      cursor: pointer;
      transition: all .15s ease;
    }

    .chip:hover {
      border-color: var(--primary);
      color: var(--text-main);
    }

    .chip.on {
      background: rgba(14, 165, 233, 0.2);
      border-color: var(--primary);
      color: #E0F2FE;
    }

    .analyze {
      margin-top: 10px;
      border: none;
      cursor: pointer;
      background: var(--primary);
      color: #04121f;
      font-weight: 700;
      font-size: 13px;
      padding: 9px 16px;
      border-radius: 10px;
    }

    .analyze:hover {
      background: var(--primary-hover);
      color: #fff;
    }

    .analyze:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .typing {
      display: inline-flex;
      gap: 4px;
    }

    .typing i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: blink 1.2s infinite;
    }

    .typing i:nth-child(2) {
      animation-delay: .2s;
    }

    .typing i:nth-child(3) {
      animation-delay: .4s;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: .2;
      }

      50% {
        opacity: 1;
      }
    }

    footer.composer {
      position: sticky;
      bottom: 0;
      background: linear-gradient(180deg, transparent, var(--bg-main) 30%);
      padding: 10px 16px 18px;
    }

    .composer-inner {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px 8px 8px 14px;
    }

    .composer-inner:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(14, 165, 233, .12);
    }

    input[type="text"] {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text-main);
      font-size: 14px;
      padding: 8px 0;
    }

    input::placeholder {
      color: var(--text-dim);
    }

    button.send {
      border: none;
      cursor: pointer;
      background: var(--primary);
      color: #04121f;
      font-weight: 700;
      font-size: 14px;
      padding: 10px 18px;
      border-radius: 10px;
    }

    button.send:hover {
      background: var(--primary-hover);
      color: #fff;
    }

    button.send:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .reset {
      border: 1px solid var(--border-light);
      background: transparent;
      color: var(--text-muted);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
      margin-left: auto;
    }

    .reset:hover {
      color: var(--text-main);
      border-color: var(--primary);
    }

    @media (max-width: 560px) {
      .brand p {
        display: none;
      }

      .status {
        font-size: 11px;
        padding: 5px 9px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">&#9764;</div>
    <div class="brand">
      <h1>AI Health ChatBot</h1>
      <p>Symptom assessment, description &amp; precautions</p>
    </div>
    <button class="reset" id="reset" type="button">New assessment</button>
    <div class="status"><span class="dot"></span> Online</div>
  </header>

  <main id="log">
    <div class="notice">Educational tool only. It is not a medical diagnosis. In an emergency call your local emergency
      number.</div>
  </main>

  <footer class="composer">
    <form class="composer-inner" id="form">
      <input type="text" id="input" placeholder="Describe your symptom, e.g. itching, high fever, headache..."
        autocomplete="off" />
      <button class="send" id="send" type="submit">Send</button>
    </form>
  </footer>

  <script>
    const log = document.getElementById('log');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const reset = document.getElementById('reset');

    let primary = null;
    let options = [];
    let selected = new Set();
    let busy = false;

    const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const pretty = (s) => s.replace(/_/g, ' ').trim();

    function scrollDown() { log.scrollTop = log.scrollHeight; }

    function addUser(text) {
      const wrap = document.createElement('div');
      wrap.className = 'msg user';
      wrap.innerHTML = '<div class="avatar">&#128100;</div><div class="bubble">' + escapeHtml(text) + '</div>';
      log.appendChild(wrap);
      scrollDown();
    }

    function botShell() {
      const wrap = document.createElement('div');
      wrap.className = 'msg bot';
      const body = document.createElement('div');
      body.className = 'bubble';
      body.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
      wrap.innerHTML = '<div class="avatar">&#9764;</div>';
      wrap.appendChild(body);
      log.appendChild(wrap);
      scrollDown();
      return body;
    }

    function renderOptions(body, reply, opts) {
      options = opts || [];
      selected = new Set();
      primary = null;
      body.textContent = reply;
      const chips = document.createElement('div');
      chips.className = 'chips';
      options.forEach((name) => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip';
        chip.textContent = pretty(name);
        chip.addEventListener('click', () => {
          if (selected.has(name)) { selected.delete(name); chip.classList.remove('on'); }
          else { selected.add(name); chip.classList.add('on'); }
          action.disabled = selected.size === 0;
        });
        chips.appendChild(chip);
      });
      body.appendChild(chips);
      const action = document.createElement('button');
      action.type = 'button';
      action.className = 'analyze';
      action.textContent = 'Analyze selected symptoms';
      action.disabled = true;
      action.addEventListener('click', () => {
        if (!selected.size || busy) return;
        const list = Array.from(selected);
        addUser('Symptoms: ' + list.map(pretty).join(', '));
        request({ symptoms: list, primary: primary });
      });
      body.appendChild(action);
      scrollDown();
    }

    function renderDiagnosis(body, data) {
      body.classList.add('card');
      const head = document.createElement('div');
      head.className = 'disease';
      head.innerHTML = 'Possible condition: <span>' + escapeHtml(data.disease) + '</span>';
      body.appendChild(head);
      const detail = document.createElement('div');
      detail.textContent = data.details;
      body.appendChild(detail);
      scrollDown();
    }

    async function request(payload) {
      if (busy) return;
      busy = true;
      send.disabled = true;
      const body = botShell();
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || 'Request failed with status ' + res.status);
        }
        const data = await res.json();
        if (data.type === 'diagnosis') {
          body.innerHTML = '';
          renderDiagnosis(body, data);
        } else if (data.type === 'options' && data.options && data.options.length) {
          primary = data.primary || null;
          renderOptions(body, data.reply, data.options, data.primary);
        } else {
          body.textContent = data.reply || 'No response.';
        }
      } catch (e) {
        body.textContent = 'Could not reach the service: ' + e.message;
      } finally {
        busy = false;
        send.disabled = false;
        scrollDown();
        input.focus();
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addUser(text);
      input.value = '';
      request({ message: text });
    });

    reset.addEventListener('click', () => {
      log.innerHTML = '<div class="notice">Educational tool only. It is not a medical diagnosis. In an emergency call your local emergency number.</div>';
      primary = null; options = []; selected = new Set();
      input.value = '';
      input.focus();
    });

    input.focus();
  </script>
</body>

</html>
